info:
  name: dolgozoi torzsadat lekerdezese
  type: http
  seq: 106

http:
  method: GET
  url: "{{baseUrl}}/admin/employees/options"
  auth:
    type: bearer
    token: "{{adminToken}}"

runtime:
  assertions:
    - expression: res.status
      operator: eq
      value: "200"
    - expression: res.body.statuses
      operator: isNotEmpty
    - expression: res.body.roles
      operator: isNotEmpty
    - expression: res.body.workSchedules
      operator: isNotEmpty
    - expression: res.body.workingHours
      operator: isNotEmpty
    - expression: res.body.managers
      operator: isNotEmpty

  actions:
    - type: set-variable
      phase: after-response
      selector:
        expression: res.body.costCenters[0].id
        method: jsonq
      variable:
        name: empCostCenterId
        scope: runtime
    - type: set-variable
      phase: after-response
      selector:
        expression: res.body.categories[0].id
        method: jsonq
      variable:
        name: empCategoryId
        scope: runtime
    - type: set-variable
      phase: after-response
      selector:
        expression: res.body.statuses[0].id
        method: jsonq
      variable:
        name: empStatusId
        scope: runtime
    - type: set-variable
      phase: after-response
      selector:
        expression: res.body.roles[0].id
        method: jsonq
      variable:
        name: empRoleId
        scope: runtime
    - type: set-variable
      phase: after-response
      selector:
        expression: res.body.roles[1].id
        method: jsonq
      variable:
        name: empRoleId2
        scope: runtime
    - type: set-variable
      phase: after-response
      selector:
        expression: res.body.workSchedules[0].id
        method: jsonq
      variable:
        name: empWorkScheduleId
        scope: runtime
    - type: set-variable
      phase: after-response
      selector:
        expression: res.body.workingHours[0].id
        method: jsonq
      variable:
        name: empWorkingHourId
        scope: runtime
    - type: set-variable
      phase: after-response
      selector:
        expression: res.body.coreHours[0].id
        method: jsonq
      variable:
        name: empCoreHourId
        scope: runtime
    - type: set-variable
      phase: after-response
      selector:
        expression: res.body.groups[0].id
        method: jsonq
      variable:
        name: empGroupId
        scope: runtime
    - type: set-variable
      phase: after-response
      selector:
        expression: res.body.managers[0].id
        method: jsonq
      variable:
        name: empManagerId
        scope: runtime

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false
