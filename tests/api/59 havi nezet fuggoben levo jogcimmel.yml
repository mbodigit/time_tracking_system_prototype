info:
  name: havi nezet fuggoben levo jogcimmel
  type: http
  seq: 59

http:
  method: GET
  url: "{{baseUrl}}/time-entries?year=2030&month=3"
  auth:
    type: bearer
    token: "{{token}}"

runtime:
  assertions:
    - expression: res.status
      operator: eq
      value: "200"
    - expression: res.body.summary.absenceMinutes
      operator: eq
      value: "0"

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false
