info:
  name: havi nezet jovahagyott jogcimmel
  type: http
  seq: 58

http:
  method: GET
  url: "{{baseUrl}}/time-entries?year=2030&month=2&employeeId={{idDolgozoM}}"
  auth:
    type: bearer
    token: "{{token}}"

runtime:
  assertions:
    - expression: res.status
      operator: eq
      value: "200"
    - expression: res.body.summary.absenceMinutes
      operator: eq
      value: "480"
    - expression: res.body.summary.settledMinutes
      operator: eq
      value: "480"

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false
