info:
  name: kerelem elozmeny vezetoi fiokkal
  type: http
  seq: 132

http:
  method: GET
  url: "{{baseUrl}}/requests?scope=managed"
  auth:
    type: bearer
    token: "{{token}}"

runtime:
  assertions:
    - expression: res.status
      operator: eq
      value: "200"
    - expression: res.body.requests
      operator: isNotEmpty

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false
