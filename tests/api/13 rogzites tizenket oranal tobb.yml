info:
  name: rogzites tizenket oranal tobb
  type: http
  seq: 13

http:
  method: POST
  url: "{{baseUrl}}/time-entries"
  body:
    type: json
    data: |-
      {
        "workingDate": "{{ma}}",
        "workStart": "{{ma}} 06:00:00",
        "workEnd": "{{ma}} 20:00:00"
      }
  auth:
    type: bearer
    token: "{{token}}"

runtime:
  assertions:
    - expression: res.status
      operator: eq
      value: "400"

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false
