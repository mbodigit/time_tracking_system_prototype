info:
  name: naptar lekerdezese admin fiokkal
  type: http
  seq: 198

http:
  method: GET
  url: "{{baseUrl}}/calendar?year={{ev}}"
  auth:
    type: bearer
    token: "{{adminToken}}"

runtime:
  assertions:
    - expression: res.status
      operator: eq
      value: "200"

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false
