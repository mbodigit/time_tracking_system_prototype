info:
  name: napi munkaido letrehozasa
  type: http
  seq: 161

http:
  method: POST
  url: "{{baseUrl}}/admin/master-data/working-hours"
  body:
    type: json
    data: |-
      {
        "num": 11,
        "name": "Bruno 11 oras"
      }
  auth:
    type: bearer
    token: "{{adminToken}}"

runtime:
  assertions:
    - expression: res.status
      operator: eq
      value: "201"

  actions:
    - type: set-variable
      phase: after-response
      selector:
        expression: res.body.id
        method: jsonq
      variable:
        name: msWorkingHourId
        scope: runtime

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false
