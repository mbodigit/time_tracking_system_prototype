info:
  name: lezaras vezetoi fiokkal
  type: http
  seq: 202

http:
  method: PATCH
  url: "{{baseUrl}}/requests/{{betegKerelemId}}/close"
  body:
    type: json
    data: |-
      {
        "endDate": "{{kerelemNap2}}"
      }
  auth:
    type: bearer
    token: "{{token}}"

runtime:
  assertions:
    - expression: res.status
      operator: eq
      value: "403"

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false
