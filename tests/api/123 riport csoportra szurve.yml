info:
  name: riport csoportra szurve
  type: http
  seq: 123

http:
  method: GET
  url: "{{baseUrl}}/reports/monthly?year={{ev}}&month={{honap}}&groupId={{firstGroupId}}"
  auth:
    type: bearer
    token: "{{hrToken}}"

runtime:
  assertions:
    - expression: res.status
      operator: eq
      value: "200"
    - expression: res.body.employees
      operator: isArray

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false
