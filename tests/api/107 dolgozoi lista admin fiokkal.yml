info:
  name: dolgozoi lista admin fiokkal
  type: http
  seq: 107

http:
  method: GET
  url: "{{baseUrl}}/admin/employees"
  auth:
    type: bearer
    token: "{{adminToken}}"

runtime:
  assertions:
    - expression: res.status
      operator: eq
      value: "200"
    - expression: res.body.employees
      operator: isNotEmpty

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false
