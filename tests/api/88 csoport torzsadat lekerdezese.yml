info:
  name: csoport torzsadat lekerdezese
  type: http
  seq: 88

http:
  method: GET
  url: "{{baseUrl}}/groups/options"
  auth:
    type: bearer
    token: "{{adminToken}}"

runtime:
  assertions:
    - expression: res.status
      operator: eq
      value: "200"
    - expression: res.body.areas
      operator: isNotEmpty
    - expression: res.body.managers
      operator: isNotEmpty

  actions:
    - type: set-variable
      phase: after-response
      selector:
        expression: res.body.areas[0].id
        method: jsonq
      variable:
        name: areaId
        scope: runtime
    - type: set-variable
      phase: after-response
      selector:
        expression: res.body.costCenters[0].id
        method: jsonq
      variable:
        name: costCenterId
        scope: runtime
    - type: set-variable
      phase: after-response
      selector:
        expression: res.body.managers[0].id
        method: jsonq
      variable:
        name: managerUserId
        scope: runtime

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false
