info:
  name: munkarend letrehozasa
  type: http
  seq: 156

http:
  method: POST
  url: "{{baseUrl}}/admin/master-data/work-schedules"
  body:
    type: json
    data: |-
      {
        "name": "Bruno munkarend",
        "isShift": false
      }
  auth:
    type: bearer
    token: "{{adminToken}}"

runtime:
  assertions:
    - expression: res.status
      operator: eq
      value: "201"

  actions:
    - type: set-variable
      phase: after-response
      selector:
        expression: res.body.id
        method: jsonq
      variable:
        name: msScheduleId
        scope: runtime

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false
