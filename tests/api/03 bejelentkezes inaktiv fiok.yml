info:
  name: bejelentkezes inaktiv fiok
  type: http
  seq: 3

http:
  method: POST
  url: "{{baseUrl}}/login"
  body:
    type: json
    data: |-
      {
        "username": "teszt.inaktiv",
        "password": "{{jelszo}}"
