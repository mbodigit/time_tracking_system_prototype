info:
  name: dolgozo torlese meglevo fiokkal
  type: http
  seq: 128

http:
  method: DELETE
  url: "{{baseUrl}}/admin/employees/{{newEmployeeId}}"
  auth:
    type: bearer
    token: "{{adminToken}}"

runtime:
  assertions:
    - expression: res.status
      operator: eq
      value: "409"

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false
