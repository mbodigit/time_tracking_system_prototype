info:
  name: jogosultsagi matrix lekerdezese
  type: http
  seq: 206

http:
  method: GET
  url: "{{baseUrl}}/admin/permissions"
  auth:
    type: bearer
    token: "{{adminToken}}"

runtime:
  assertions:
    - expression: res.status
      operator: eq
      value: "200"
    - expression: res.body.roles
      operator: isNotEmpty
    - expression: res.body.permissions
      operator: isNotEmpty

  actions:
    - type: set-variable
      phase: after-response
      selector:
        expression: res.body.roles[3].id
        method: jsonq
      variable:
        name: dolgozoRoleId
        scope: runtime
    - type: set-variable
      phase: after-response
      selector:
        expression: res.body.roles[0].id
        method: jsonq
      variable:
        name: adminRoleId
        scope: runtime
    - type: set-variable
      phase: after-response
      selector:
        expression: res.body.permissions[7].id
        method: jsonq
      variable:
        name: tesztPermissionId
        scope: runtime

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false
