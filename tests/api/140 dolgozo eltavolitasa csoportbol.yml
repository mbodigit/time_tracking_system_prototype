info:
  name: dolgozo eltavolitasa csoportbol
  type: http
  seq: 140

http:
  method: PATCH
  url: "{{baseUrl}}/groups/{{memberGroupId}}/members"
  body:
    type: json
    data: |-
      {
        "remove": [{{newEmployeeId}}]
      }
  auth:
    type: bearer
    token: "{{adminToken}}"

runtime:
  assertions:
    - expression: res.status
      operator: eq
      value: "200"

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false
