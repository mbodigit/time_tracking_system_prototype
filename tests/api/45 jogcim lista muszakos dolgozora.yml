info:
  name: jogcim lista muszakos dolgozora
  type: http
  seq: 45

http:
  method: GET
  url: "{{baseUrl}}/absences?employeeId={{idDolgozoM}}"
  auth:
    type: bearer
    token: "{{token}}"

runtime:
  assertions:
    - expression: res.status
      operator: eq
      value: "200"
    - expression: res.body.absences
      operator: isNotEmpty
    - expression: res.body.absences.length
      operator: eq
      value: "14"

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false
