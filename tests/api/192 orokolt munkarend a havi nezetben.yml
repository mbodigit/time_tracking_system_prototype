info:
  name: orokolt munkarend a havi nezetben
  type: http
  seq: 192

http:
  method: GET
  url: "{{baseUrl}}/time-entries?year={{ev}}&month={{honap}}&employeeId={{inheritEmployeeId}}"
  auth:
    type: bearer
    token: "{{hrToken}}"

runtime:
  assertions:
    - expression: res.status
      operator: eq
      value: "200"
    - expression: res.body.employeeProfile.workScheduleName
      operator: isNotEmpty
    - expression: res.body.employeeProfile.workingHourNum
      operator: isNumber
    - expression: res.body.employeeProfile.coreStart
      operator: isNotEmpty

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false
