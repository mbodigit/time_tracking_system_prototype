info:
  name: havi nezet sajat honap
  type: http
  seq: 19

http:
  method: GET
  url: "{{baseUrl}}/time-entries?year={{ev}}&month={{honap}}"
  auth:
    type: bearer
    token: "{{token}}"

runtime:
  assertions:
    - expression: res.status
      operator: eq
      value: "200"

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false
