info:
  name: jogcim letrehozasa
  type: http
  seq: 175

http:
  method: POST
  url: "{{baseUrl}}/admin/absences"
  body:
    type: json
    data: |-
      {
        "name": "Bruno jogcim",
        "payrollCodeId": {{absFreeCodeId}},
        "isPaid": true,
        "isOpenEnded": false,
        "status": true,
        "sort": 900,
        "workScheduleIds": [{{absScheduleId}}]
      }
  auth:
    type: bearer
    token: "{{adminToken}}"

runtime:
  assertions:
    - expression: res.status
      operator: eq
      value: "201"

  actions:
    - type: set-variable
      phase: after-response
      selector:
        expression: res.body.id
        method: jsonq
      variable:
        name: newAbsenceId
        scope: runtime

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false
