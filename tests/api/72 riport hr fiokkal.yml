info:
  name: riport hr fiokkal
  type: http
  seq: 72

http:
  method: GET
  url: "{{baseUrl}}/reports/monthly?year={{ev}}&month={{honap}}"
  auth:
    type: bearer
    token: "{{hrToken}}"

runtime:
  assertions:
    - expression: res.status
      operator: eq
      value: "200"

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false
