info:
  name: rotacio nem muszakos csoportra
  type: http
  seq: 218

http:
  method: POST
  url: "{{baseUrl}}/groups"
  body:
    type: json
    data: |-
      {
        "name": "Bruno teszt rotacio munkarend nelkul",
        "description": "Automata teszt, torolheto",
        "areaId": {{areaId}},
        "costCenterId": {{costCenterId}},
        "managerId": {{managerUserId}},
        "workScheduleId": {{flexScheduleId}},
        "rotationPosition": 1,
        "rotationStart": "2026-01-05"
      }
  auth:
    type: bearer
    token: "{{adminToken}}"

runtime:
  assertions:
    - expression: res.status
      operator: eq
      value: "400"

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false
