info:
  name: havi nezet kotetlen dolgozora
  type: http
  seq: 118

http:
  method: GET
  url: "{{baseUrl}}/time-entries?year={{ev}}&month={{honap}}&employeeId={{idKotetlen}}"
  auth:
    type: bearer
    token: "{{hrToken}}"

runtime:
  assertions:
    - expression: res.status
      operator: eq
      value: "200"
    - expression: res.body.isFlexible
      operator: isTruthy
    - expression: res.body.summary.balanceMinutes
      operator: eq
      value: "0"
    - expression: res.body.summary.frameMinutes
      operator: isNumber

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false
