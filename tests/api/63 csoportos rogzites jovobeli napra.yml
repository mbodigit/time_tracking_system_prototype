info:
  name: csoportos rogzites jovobeli napra
  type: http
  seq: 63

http:
  method: POST
  url: "{{baseUrl}}/time-entries/bulk"
  body:
    type: json
    data: |-
      {
        "workingDate": "{{jovoNap}}",
        "entries": [
          { "employeeId": {{idDolgozoM}}, "workStart": "{{jovoNap}} 08:00:00", "workEnd": "{{jovoNap}} 16:00:00" }
        ]
      }
  auth:
    type: bearer
    token: "{{token}}"

runtime:
  assertions:
    - expression: res.status
      operator: eq
      value: "400"

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false
