info:
  name: havi nezet hatokoron kivuli dolgozora
  type: http
  seq: 21

http:
  method: GET
  url: "{{baseUrl}}/time-entries?year={{ev}}&month={{honap}}&employeeId={{idKivulallo}}"
  auth:
    type: bearer
    token: "{{token}}"

runtime:
  assertions:
    - expression: res.status
      operator: eq
      value: "403"

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false
