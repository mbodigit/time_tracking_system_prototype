info:
  name: elrendeles visszavonasa nem letezo sorra
  type: http
  seq: 28

http:
  method: PUT
  url: "{{baseUrl}}/time-entries/ordered"
  body:
    type: json
    data: |-
      {
        "employeeId": {{idDolgozoM}},
        "workingDate": "{{jovoNap}}",
        "isOrdered": false
      }
  auth:
    type: bearer
    token: "{{token}}"

runtime:
  assertions:
    - expression: res.status
      operator: eq
      value: "404"

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false
