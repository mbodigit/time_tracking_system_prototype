info:
  name: szervezet lekerdezese admin fiokkal
  type: http
  seq: 96

http:
  method: GET
  url: "{{baseUrl}}/org"
  auth:
    type: bearer
    token: "{{adminToken}}"

runtime:
  assertions:
    - expression: res.status
      operator: eq
      value: "200"
    - expression: res.body.areas
      operator: isArray
    - expression: res.body.managers
      operator: isNotEmpty

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false
