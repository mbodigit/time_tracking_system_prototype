info:
  name: modositas harom napon tul
  type: http
  seq: 24

http:
  method: PATCH
  url: "{{baseUrl}}/time-entries/{{regiEntryId}}"
  body:
    type: json
    data: |-
      {
        "workEnd": "{{regiNap}} 17:00:00",
        "note": "Harom napon tuli javitasi kiserlet"
      }
  auth:
    type: bearer
    token: "{{token}}"

runtime:
  assertions:
    - expression: res.status
      operator: eq
      value: "403"

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false
