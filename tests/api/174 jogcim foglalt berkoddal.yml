info:
  name: jogcim foglalt berkoddal
  type: http
  seq: 174

http:
  method: POST
  url: "{{baseUrl}}/admin/absences"
  body:
    type: json
    data: |-
      {
        "name": "Bruno jogcim foglalt koddal",
        "payrollCodeId": {{absUsedCodeId}},
        "isPaid": true,
        "isOpenEnded": false,
        "status": true,
        "sort": 901,
        "workScheduleIds": [{{absScheduleId}}]
      }
  auth:
    type: bearer
    token: "{{adminToken}}"

runtime:
  assertions:
    - expression: res.status
      operator: eq
      value: "409"

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false
