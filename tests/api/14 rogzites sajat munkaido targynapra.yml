info:
  name: rogzites sajat munkaido targynapra
  type: http
  seq: 14

http:
  method: POST
  url: "{{baseUrl}}/time-entries"
  body:
    type: json
    data: |-
      {
        "workingDate": "{{ma}}",
        "workStart": "{{ma}} 08:00:00",
        "workEnd": "{{ma}} 16:00:00"
      }
  auth:
    type: bearer
    token: "{{token}}"

runtime:
  assertions:
    - expression: res.status
      operator: eq
      value: "201"

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false
