info:
  name: rogzites hatokorbe tartozo dolgozora
  type: http
  seq: 16

http:
  method: POST
  url: "{{baseUrl}}/time-entries"
  body:
    type: json
    data: |-
      {
        "employeeId": {{idDolgozoM}},
        "workingDate": "{{tegnap}}",
        "workStart": "{{tegnap}} 22:00:00",
        "workEnd": "{{ma}} 06:00:00"
      }
  auth:
    type: bearer
    token: "{{token}}"

runtime:
  assertions:
    - expression: res.status
      operator: eq
      value: "201"

  actions:
    - type: set-variable
      phase: after-response
      selector:
        expression: res.body.id
        method: jsonq
      variable:
        name: entryId
        scope: runtime

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false
