info:
  name: rogzites kotetlen munkarendu dolgozora
  type: http
  seq: 18

http:
  method: POST
  url: "{{baseUrl}}/time-entries"
  body:
    type: json
    data: |-
      {
        "employeeId": {{idKotetlen}},
        "workingDate": "{{tegnap}}",
        "workStart": "{{tegnap}} 08:00:00",
        "workEnd": "{{tegnap}} 16:00:00"
      }
  auth:
    type: bearer
    token: "{{hrToken}}"

runtime:
  assertions:
    - expression: res.status
      operator: eq
      value: "409"

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false
