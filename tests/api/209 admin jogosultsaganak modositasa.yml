info:
  name: admin jogosultsaganak modositasa
  type: http
  seq: 209

http:
  method: PATCH
  url: "{{baseUrl}}/admin/permissions"
  body:
    type: json
    data: |-
      {
        "roleId": {{adminRoleId}},
        "permissionId": {{tesztPermissionId}},
        "granted": false
      }
  auth:
    type: bearer
    token: "{{adminToken}}"

runtime:
  assertions:
    - expression: res.status
      operator: eq
      value: "409"

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false
