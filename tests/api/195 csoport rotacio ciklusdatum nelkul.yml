http:
  method: POST
  url: "{{baseUrl}}/groups"
  body:
    type: json
    data: |-
      {
        "name": "Bruno teszt rotacio",
        "description": "Automata teszt, torolheto",
        "areaId": {{areaId}},
        "costCenterId": {{costCenterId}},
