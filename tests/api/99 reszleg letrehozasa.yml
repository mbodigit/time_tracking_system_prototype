info:
  name: reszleg letrehozasa
  type: http
  seq: 99

http:
  method: POST
  url: "{{baseUrl}}/org/departments"
  body:
    type: json
    data: |-
      {
        "name": "Bruno teszt reszleg",
        "parentId": {{newAreaId}},
        "managerId": null
      }
  auth:
    type: bearer
    token: "{{adminToken}}"

runtime:
  assertions:
    - expression: res.status
      operator: eq
      value: "201"

  actions:
    - type: set-variable
      phase: after-response
      selector:
        expression: res.body.id
        method: jsonq
      variable:
        name: newDepartmentId
        scope: runtime

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false
