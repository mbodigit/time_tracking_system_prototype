info:
  name: jogcim lista dolgozoi fiokkal
  type: http
  seq: 180

http:
  method: GET
  url: "{{baseUrl}}/admin/absences"
  auth:
    type: bearer
    token: "{{dolgozoToken}}"

runtime:
  assertions:
    - expression: res.status
      operator: eq
      value: "403"

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false
