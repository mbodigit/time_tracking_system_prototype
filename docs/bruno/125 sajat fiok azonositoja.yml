info:
  name: sajat fiok azonositoja
  type: http
  seq: 125

http:
  method: GET
  url: "{{baseUrl}}/me"
  auth:
    type: bearer
    token: "{{adminToken}}"

runtime:
  assertions:
    - expression: res.status
      operator: eq
      value: "200"

  actions:
    - type: set-variable
      phase: after-response
      selector:
        expression: res.body.user.userId
        method: jsonq
      variable:
        name: adminUserId
        scope: runtime

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false
