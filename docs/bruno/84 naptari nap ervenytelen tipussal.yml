info:
  name: naptari nap ervenytelen tipussal
  type: http
  seq: 84

http:
  method: POST
  url: "{{baseUrl}}/calendar"
  body:
    type: json
    data: |-
      {
        "date": "2030-06-16",
        "dayType": "Szabadnap"
      }
  auth:
    type: bearer
    token: "{{hrToken}}"

runtime:
  assertions:
    - expression: res.status
      operator: eq
      value: "400"

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false
