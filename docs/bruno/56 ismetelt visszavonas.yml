info:
  name: ismetelt visszavonas
  type: http
  seq: 56

http:
  method: PATCH
  url: "{{baseUrl}}/requests/{{requestId}}/withdraw"
  auth:
    type: bearer
    token: "{{token}}"

runtime:
  assertions:
    - expression: res.status
      operator: eq
      value: "409"

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false
