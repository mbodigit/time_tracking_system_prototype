info:
  name: torolheto dolgozo felvetele
  type: http
  seq: 129

http:
  method: POST
  url: "{{baseUrl}}/admin/employees"
  body:
    type: json
    data: |-
      {
        "lastName": "Bruno",
        "firstName": "Torolheto",
        "costCenterId": {{empCostCenterId}},
        "categoryId": {{empCategoryId}},
        "statusId": {{empStatusId}}
      }
  auth:
    type: bearer
    token: "{{adminToken}}"

runtime:
  assertions:
    - expression: res.status
      operator: eq
      value: "201"

  actions:
    - type: set-variable
      phase: after-response
      selector:
        expression: res.body.id
        method: jsonq
      variable:
        name: newDeletableId
        scope: runtime

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false
