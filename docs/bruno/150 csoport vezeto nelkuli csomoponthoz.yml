info:
  name: csoport vezeto nelkuli csomoponthoz
  type: http
  seq: 150

http:
  method: POST
  url: "{{baseUrl}}/groups"
  body:
    type: json
    data: |-
      {
        "name": "Bruno vezeto nelkuli csoport",
        "areaId": {{freeAreaId}},
        "costCenterId": {{costCenterId}}
      }
  auth:
    type: bearer
    token: "{{adminToken}}"

runtime:
  assertions:
    - expression: res.status
      operator: eq
      value: "400"

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false
