info:
  name: statisztika dolgozoi fiokkal
  type: http
  seq: 122

http:
  method: GET
  url: "{{baseUrl}}/reports/statistics?year={{ev}}&month={{honap}}&dimension=workSchedule"
  auth:
    type: bearer
    token: "{{dolgozoToken}}"

runtime:
  assertions:
    - expression: res.status
      operator: eq
      value: "403"

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false
