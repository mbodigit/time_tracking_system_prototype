info:
  name: attekinto vezetoi fiokkal
  type: http
  seq: 76

http:
  method: GET
  url: "{{baseUrl}}/dashboard?year={{ev}}&month={{honap}}"
  auth:
    type: bearer
    token: "{{token}}"

runtime:
  assertions:
    - expression: res.status
      operator: eq
      value: "200"
    - expression: res.body.approval.pending
      operator: isNumber

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false
