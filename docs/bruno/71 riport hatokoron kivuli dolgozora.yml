info:
  name: riport hatokoron kivuli dolgozora
  type: http
  seq: 71

http:
  method: GET
  url: "{{baseUrl}}/reports/monthly?year={{ev}}&month={{honap}}&employeeId={{idKivulallo}}"
  auth:
    type: bearer
    token: "{{token}}"

runtime:
  assertions:
    - expression: res.status
      operator: eq
      value: "200"
    - expression: res.body.employees.length
      operator: eq
      value: "0"

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false
