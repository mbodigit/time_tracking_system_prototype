info:
  name: naptar lekerdezese vezetoi fiokkal
  type: http
  seq: 80

http:
  method: GET
  url: "{{baseUrl}}/calendar?year={{ev}}"
  auth:
    type: bearer
    token: "{{token}}"

runtime:
  assertions:
    - expression: res.status
      operator: eq
      value: "403"

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false
