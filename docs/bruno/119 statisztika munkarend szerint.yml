info:
  name: statisztika munkarend szerint
  type: http
  seq: 119

http:
  method: GET
  url: "{{baseUrl}}/reports/statistics?year={{ev}}&month={{honap}}&dimension=workSchedule"
  auth:
    type: bearer
    token: "{{hrToken}}"

runtime:
  assertions:
    - expression: res.status
      operator: eq
      value: "200"
    - expression: res.body.rows
      operator: isArray
    - expression: res.body.dimension
      operator: eq
      value: workSchedule

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false
