info:
  name: kerelem beosztottra
  type: http
  seq: 48

http:
  method: POST
  url: "{{baseUrl}}/requests"
  body:
    type: json
    data: |-
      {
        "employeeId": {{idDolgozoM}},
        "absenceId": 1,
        "startDate": "{{kerelemNap}}",
        "endDate": "{{kerelemNap}}"
      }
  auth:
    type: bearer
    token: "{{token}}"

runtime:
  assertions:
    - expression: res.status
      operator: eq
      value: "201"

  actions:
    - type: set-variable
      phase: after-response
      selector:
        expression: res.body.id
        method: jsonq
      variable:
        name: subRequestId
        scope: runtime

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false
