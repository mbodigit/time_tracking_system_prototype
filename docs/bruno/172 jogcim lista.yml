info:
  name: jogcim lista
  type: http
  seq: 172

http:
  method: GET
  url: "{{baseUrl}}/admin/absences"
  auth:
    type: bearer
    token: "{{adminToken}}"

runtime:
  assertions:
    - expression: res.status
      operator: eq
      value: "200"
    - expression: res.body.absences
      operator: isNotEmpty
    - expression: res.body.workSchedules
      operator: isNotEmpty

  actions:
    - type: set-variable
      phase: after-response
      selector:
        expression: res.body.workSchedules[0].id
        method: jsonq
      variable:
        name: absScheduleId
        scope: runtime

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false
