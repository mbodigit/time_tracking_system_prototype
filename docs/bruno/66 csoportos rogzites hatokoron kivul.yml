info:
  name: csoportos rogzites hatokoron kivul
  type: http
  seq: 66

http:
  method: POST
  url: "{{baseUrl}}/time-entries/bulk"
  body:
    type: json
    data: |-
      {
        "workingDate": "{{csoportNap}}",
        "entries": [
          { "employeeId": {{idKivulallo}}, "workStart": "{{csoportNap}} 08:00:00", "workEnd": "{{csoportNap}} 16:00:00" }
        ]
      }
  auth:
    type: bearer
    token: "{{token}}"

runtime:
  assertions:
    - expression: res.status
      operator: eq
      value: "200"
    - expression: res.body.results[0].status
      operator: eq
      value: "error"

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false
