info:
  name: hr rogzites regi napra
  type: http
  seq: 37

http:
  method: POST
  url: "{{baseUrl}}/time-entries"
  body:
    type: json
    data: |-
      {
        "employeeId": {{idDolgozoM}},
        "workingDate": "{{regiNap2}}",
        "workStart": "{{regiNap2}} 08:00:00",
        "workEnd": "{{regiNap2}} 16:00:00",
        "note": "HR havi zaras, potlas"
      }
  auth:
    type: bearer
    token: "{{hrToken}}"

runtime:
  assertions:
    - expression: res.status
      operator: eq
      value: "201"

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false
