info:
  name: naptar lekerdezese hr fiokkal
  type: http
  seq: 79

http:
  method: GET
  url: "{{baseUrl}}/calendar?year={{ev}}"
  auth:
    type: bearer
    token: "{{hrToken}}"

runtime:
  assertions:
    - expression: res.status
      operator: eq
      value: "200"
    - expression: res.body.dayTypes.length
      operator: eq
      value: "3"

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false
