info:
  name: szervezet lekerdezese hr fiokkal
  type: http
  seq: 97

http:
  method: GET
  url: "{{baseUrl}}/org"
  auth:
    type: bearer
    token: "{{hrToken}}"

runtime:
  assertions:
    - expression: res.status
      operator: eq
      value: "403"

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false
