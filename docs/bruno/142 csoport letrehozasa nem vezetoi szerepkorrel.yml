info:
  name: csoport letrehozasa nem vezetoi szerepkorrel
  type: http
  seq: 142

http:
  method: POST
  url: "{{baseUrl}}/groups"
  body:
    type: json
    data: |-
      {
        "name": "Bruno hibas vezeto",
        "areaId": {{areaId}},
        "costCenterId": {{costCenterId}},
        "managerId": {{adminUserId}}
      }
  auth:
    type: bearer
    token: "{{adminToken}}"

runtime:
  assertions:
    - expression: res.status
      operator: eq
      value: "400"

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false
