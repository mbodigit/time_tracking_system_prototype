info:
  name: napi lista datum nelkul
  type: http
  seq: 60

http:
  method: GET
  url: "{{baseUrl}}/time-entries/daily"
  auth:
    type: bearer
    token: "{{token}}"

runtime:
  assertions:
    - expression: res.status
      operator: eq
      value: "400"

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false
