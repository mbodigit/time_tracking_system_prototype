info:
  name: fiok tiltasa
  type: http
  seq: 116

http:
  method: PATCH
  url: "{{baseUrl}}/admin/users/{{newUserId}}"
  body:
    type: json
    data: |-
      {
        "isActive": false
      }
  auth:
    type: bearer
    token: "{{adminToken}}"

runtime:
  assertions:
    - expression: res.status
      operator: eq
      value: "200"

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false
