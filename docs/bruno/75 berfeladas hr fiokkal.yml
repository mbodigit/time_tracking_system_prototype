info:
  name: berfeladas hr fiokkal
  type: http
  seq: 75

http:
  method: GET
  url: "{{baseUrl}}/reports/payroll?year={{ev}}&month={{honap}}"
  auth:
    type: bearer
    token: "{{hrToken}}"

runtime:
  assertions:
    - expression: res.status
      operator: eq
      value: "200"
    - expression: res.headers['content-type']
      operator: contains
      value: "text/csv"

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false
